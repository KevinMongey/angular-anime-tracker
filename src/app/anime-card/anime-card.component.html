
<ion-card button="true" (click)="navDetails()">
  <div class="image-container">
    <img alt="anime banner" [src]="anime.images.jpg.large_image_url">
  </div>
  <ion-chip>{{anime.status}}</ion-chip>
  <ion-card-header>
    <ion-card-title>{{anime.title_english || anime.title}}</ion-card-title>
    <ion-card-subtitle>
      
    </ion-card-subtitle>
  </ion-card-header>
  <ion-card-content class="rating"><ion-icon name="star-sharp" aria-hidden="true"></ion-icon> {{anime.score}}</ion-card-content>
</ion-card>
