<section class="row">
  <div class="header">
    <H2>{{ title }}</H2>
  </div>
  <div class="body">
    @for (anime of anime; track anime.images) {
      <ion-card>
        <img alt="anime banner" [src]="anime.images.jpg.large_image_url">
        <ion-chip>{{anime.status}}</ion-chip>
        <ion-card-header>
          <ion-card-title>{{anime.title_english}}</ion-card-title>
          <ion-card-subtitle>
           
          </ion-card-subtitle>
        </ion-card-header>
        <ion-card-content class="rating"><ion-icon name="star-sharp" aria-hidden="true"></ion-icon> {{anime.score}}</ion-card-content>
      </ion-card>
    }
  </div>
</section>
