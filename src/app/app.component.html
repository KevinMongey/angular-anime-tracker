<ion-app>
    <ion-split-pane contentId="main" when="lg">
      <ion-menu contentId="main">
        <ion-header>
          <ion-toolbar>
            <ion-title>AniFix</ion-title>
          </ion-toolbar>
        </ion-header>

        <ion-content>

        <ion-list>
          <ion-menu-toggle autoHide="false">
            <ion-item
              [routerLink]="['/home']"
              routerDirection="root">
              <ion-icon slot="start" name="home-sharp" aria-hidden="true"></ion-icon>
              <ion-label>Home</ion-label>
            </ion-item>
            <ion-item
              [routerLink]="['/search']"
              routerDirection="root">
              <ion-icon slot="start" name="search-Sharp" aria-hidden="true"></ion-icon>
              <ion-label>Search</ion-label>
            </ion-item>
            <ion-item
              [routerLink]="['/my-list']"
              routerDirection="root">
              <ion-icon slot="start" name="bookmark-sharp" aria-hidden="true"></ion-icon>
              <ion-label>My List</ion-label>
            </ion-item>
            <ion-item
              [routerLink]="['/settings']"
              routerDirection="root">
              <ion-icon slot="start" name="settings-sharp" aria-hidden="true"></ion-icon>
              <ion-label>Settings</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

      </ion-content>
      </ion-menu>

      <ion-router-outlet id="main"></ion-router-outlet>

    </ion-split-pane>


</ion-app>
